<!DOCTYPE html>
<html lang="pt-BR" class="is-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junigami · Diário de um jogador</title>
<meta name="description" content="Resenhas sinceras de um jogador apaixonado: notas, opiniões e listas dos jogos que passaram pelo controle.">
<meta name="theme-color" content="#0a0a0e">
<meta property="og:type" content="website">
<meta property="og:title" content="Junigami · Diário de um jogador">
<meta property="og:description" content="Resenhas sinceras de um jogador apaixonado.">
<link id="fav" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
/* aplica o último tema salvo antes de pintar a página (evita "piscar" de cor) */
(function(){try{
  var t=JSON.parse(localStorage.getItem('junigami:tema')||'null'), ok=/^#[0-9a-f]{6}$/i;
  if(t&&ok.test(t.acc)&&ok.test(t.acc2)){
    var lum=function(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
    var s=document.documentElement.style;
    s.setProperty('--acc',t.acc);s.setProperty('--acc2',t.acc2);
    s.setProperty('--on-acc',lum(t.acc)>.38?'#0a0a0e':'#fff');s.setProperty('--on-acc2',lum(t.acc2)>.38?'#0a0a0e':'#fff');
  }
}catch(e){}})();
</script>
</head>
<body>

<!-- tela de carregamento -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-px"><i style="--x:6;--dl:0s"></i><i style="--x:16;--dl:1.1s"></i><i style="--x:27;--dl:.4s"></i><i style="--x:38;--dl:2.2s"></i><i style="--x:49;--dl:.9s"></i><i style="--x:58;--dl:1.8s"></i><i style="--x:69;--dl:.2s"></i><i style="--x:78;--dl:1.4s"></i><i style="--x:88;--dl:2.6s"></i><i style="--x:95;--dl:.7s"></i></div>
  <div class="splash-in">
    <div class="splash-pad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="1em" height="1em"><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258A4 4 0 0 0 17.32 5z"/><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line class="sp-b1" x1="15" x2="15.01" y1="12" y2="12" stroke-width="2.6"/><line class="sp-b2" x1="18" x2="18.01" y1="10" y2="10" stroke-width="2.6"/></svg>
    </div>
    <div class="splash-name" id="spName">JUNIGAMI</div>
    <div class="splash-tag" id="spTag">Diário de um jogador</div>
    <div class="splash-bar"><i id="spBar"></i></div>
    <div class="splash-msg" id="spMsg">Carregando...</div>
  </div>
</div>
<script>
/* controla a tela de carregamento (roda antes do resto do site) */
(function(){
  var d=document, el=d.getElementById('splash'); if(!el) return;
  var site={}; try{ site=JSON.parse(localStorage.getItem('junigami:site')||'{}')||{}; }catch(e){}
  var cached=!!site.nome;
  if(site.nome) d.getElementById('spName').textContent=site.nome;
  if(typeof site.tagline==='string') d.getElementById('spTag').textContent=site.tagline;
  var frases=String(site.frasesLoading||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
  if(!frases.length) frases=['Aquecendo os controles...','Salvando o progresso...','Derrotando o chefe final...','Procurando o último checkpoint...','Carregando a próxima fase...','Afiando a espada...','Soprando o cartucho...'];
  var msg=d.getElementById('spMsg'), bar=d.getElementById('spBar'), i=Math.floor(Math.random()*frases.length), p=0, t0=Date.now(), fim=false;
  function troca(){ msg.classList.add('out'); setTimeout(function(){ if(fim) return; msg.textContent=frases[i++%frases.length]; msg.classList.remove('out'); },170); }
  msg.textContent=frases[i++%frases.length];
  var t1=setInterval(troca,1250);
  var t2=setInterval(function(){ p+=(88-p)*.09; bar.style.width=p.toFixed(1)+'%'; },110);
  function encerrar(){
    if(fim) return; fim=true; clearInterval(t1); clearInterval(t2);
    msg.classList.remove('out'); msg.textContent='Pronto! Boa diversão'; bar.style.width='100%'; el.classList.add('ready');
    setTimeout(function(){
      el.classList.add('leave'); d.documentElement.classList.remove('is-loading');
      setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1000);
    },520);
  }
  /* o site chama isto quando os dados chegam; garante um tempo mínimo para a animação aparecer */
  window.__splashDone=function(){ var min=cached?1000:1700, espera=Math.max(0,min-(Date.now()-t0)); setTimeout(encerrar,espera); };
  setTimeout(encerrar,14000); /* segurança: nunca prende o visitante */
})();
</script>

<div class="progress" id="progress"><i></i></div>
<div id="demo-bar" class="demo-bar hide"></div>
<header class="top" id="header"></header>
<main id="app" tabindex="-1"></main>
<footer class="foot" id="footer"></footer>

<button class="totop" id="toTop" aria-label="Voltar ao topo" title="Voltar ao topo"></button>

<div class="lb hide" id="lb" role="dialog" aria-modal="true" aria-label="Galeria">
  <button class="lb-x" id="lbX" aria-label="Fechar">×</button>
  <button class="lb-n lb-p" id="lbP" aria-label="Anterior">‹</button>
  <img id="lbImg" alt="" referrerpolicy="no-referrer">
  <button class="lb-n" id="lbN" aria-label="Próxima">›</button>
</div>
<div class="toast" id="toast" role="status"></div>

<noscript><p style="padding:40px;text-align:center">Este site precisa de JavaScript para carregar as resenhas.</p></noscript>
<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
